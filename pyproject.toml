[project]
name = "aiml-knowledge-agent"
version = "0.1.0"
description = "RAG-powered research assistant for AI/ML tooling with multi-agent orchestration."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "qdrant-client>=1.9",
    "langchain>=0.2.17",
    "langgraph>=0.1",
    "sentence-transformers>=2.7",
    "httpx>=0.27",
    "python-multipart>=0.0.27",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "langchain-text-splitters>=1.1.2",
    "langchain-core>=1.3.3",
    "langsmith>=0.8.0,<1.0.0",
    "urllib3>=2.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "mypy>=1.10",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.uv]
exclude-newer = "2026-05-07"

[tool.setuptools.packages.find]
where = ["src"]
include = ["aiml_knowledge_agent*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
